<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Groups Organizer</title>
    <style>
      body {
        min-width: 280px;
      }
    </style>
  </head>

  <body>
    <header id="toolbar"></header>
    <main class="content">
      <section>
        <h2 class="section-title">Assign category to this tab's group:</h2>
        <ul id="category-pick-list" class="category-pick-list"></ul>
        <p id="assign-status" class="status" role="status"></p>
      </section>
      <p id="tab-count"></p>
    </main>
    <dialog id="no-group-dialog">
      <div class="dialog-message">
        <span id="no-group-icon" class="dialog-icon"></span>
        <p>
          The active tab must be a part of a tab group to assign the category.
        </p>
      </div>
      <button class="text-button" autofocus>OK</button>
    </dialog>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
