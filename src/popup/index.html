<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabGroup Marker</title>
  </head>

  <body class="popup-page">
    <header class="toolbar">
      <div class="toolbar-brand">
        <img class="toolbar-logo" src="../icons/icon-48.png" alt="" />
        <h1 class="toolbar-title">TabGroup Marker</h1>
      </div>
      <div class="icon-button-group">
        <button
          id="toolbar-ungroup"
          class="icon-button"
          type="button"
          aria-label="Ungroup"
          title="Ungroup"
        ></button>
        <button
          id="toolbar-group-delete"
          class="icon-button"
          type="button"
          aria-label="Delete Group"
          title="Delete Group"
        ></button>
        <hr />
        <button
          id="toolbar-settings"
          class="icon-button"
          type="button"
          aria-label="Settings"
          title="Settings"
        ></button>
      </div>
    </header>
    <main class="content">
      <section>
        <ul id="category-pick-list" class="category-pick-list"></ul>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
