<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabGroup Marker</title>
    <style>
      body {
        min-width: 280px;
      }
    </style>
  </head>

  <body class="popup-page">
    <header class="toolbar">
      <div class="toolbar-brand">
        <img class="toolbar-logo" src="../icons/icon-48.png" alt="" />
        <h1 class="toolbar-title">TabGroup Marker</h1>
      </div>
      <button
        id="toolbar-settings"
        class="icon-button"
        type="button"
        aria-label="Settings"
        title="Settings"
      ></button>
    </header>
    <main class="content">
      <section>
        <h2 class="section-title">Select category for this tab group:</h2>
        <ul id="category-pick-list" class="category-pick-list"></ul>
      </section>
    </main>
    <dialog id="no-group-dialog">
      <div class="dialog-message">
        <span id="no-group-icon" class="dialog-icon"></span>
        <p>Please add this tab to a group first.</p>
      </div>
      <button class="text-button" autofocus>OK</button>
    </dialog>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
