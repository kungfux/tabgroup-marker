<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Group Tags</title>
  </head>

  <body class="settings-page">
    <header class="toolbar">
      <div class="toolbar-brand">
        <img class="toolbar-logo" src="../icons/icon-48.png" alt="" />
        <h1 class="toolbar-title">Group Tags - Settings</h1>
      </div>
    </header>
    <main class="content settings-content">
      <section>
        <h3>Tags</h3>
        <p class="muted">
          Manage the tags used to categorize your tab groups. Choose color and
          emoji for the tag. Give it a unique look and name.
          <span id="emoji-hint" />
        </p>
        <br />
        <div class="category-header" aria-hidden="true">
          <span class="category-header-color">Color</span>
          <span class="category-header-icon">Icon</span>
          <span class="category-header-name">Tag name</span>
          <span class="category-header-actions"></span>
        </div>
        <ul id="category-list" class="category-list"></ul>
        <button id="category-add" class="text-button">Add tag</button>
        <p id="category-status" class="status" role="status"></p>
      </section>
      <section>
        <h3>Shortcuts</h3>
        <p class="muted">Manage keyboard shortcuts for the extension.</p>
        <button id="configure-shortcuts" class="text-button" type="button">
          Configure Shortcuts
        </button>
      </section>
    </main>
    <footer class="settings-footer">
      <p class="footer-copyright">
        © <span id="current-year"></span> Group Tags
      </p>
      <nav class="footer-links" aria-label="Footer links">
        <a
          href="https://github.com/issues/new"
          target="_blank"
          rel="noopener noreferrer"
        >
          Report an issue
        </a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer">
          Project website
        </a>
      </nav>
    </footer>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
